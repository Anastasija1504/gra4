*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14252d;color:#f8edd2;font-family:"MissionPixel",ui-monospace,monospace;letter-spacing:0;text-rendering:optimizeSpeed;-webkit-font-smoothing:none;font-smooth:never}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd56d;outline-offset:2px}[hidden]{display:none!important}
#game{height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at top,#3d585d 0%,#1f333b 45%,#14242c 100%);overflow:hidden}
#world{position:relative;width:min(100vw,150dvh);height:min(100dvh,66.6667vw);overflow:hidden;isolation:isolate;box-shadow:0 0 0 4px #0d1a20,0 0 0 8px #294149,0 0 0 12px #0d1a20,0 0 40px #081217aa}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none;touch-action:none;background:#cfdfe7}

/* universal pixel panel */
#avatarBtn,#prompt,#dialogue,.choice,.dpad button,#actionBtn,.avatar-pick,.edit-code input{
  border-radius:0;
  image-rendering:pixelated;
}
#avatarBtn{
  position:absolute;z-index:4;top:12px;right:12px;display:flex;align-items:center;gap:6px;
  min-height:34px;padding:6px 10px;border:2px solid #ecd2a3;background:#274149;color:#fff2d0;
  box-shadow:inset -2px -2px 0 #162a31,inset 2px 2px 0 #3f6570,0 4px 0 #112126;
  font-size:12px;font-weight:700;text-transform:uppercase
}
#avatarBtn:hover{background:#315159}
#avatarBtn:active{transform:translateY(2px);box-shadow:inset -2px -2px 0 #162a31,inset 2px 2px 0 #3f6570,0 2px 0 #112126}
#avatarBtn span{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;background:#1a2f35;border:1px solid #88a39f;color:#f0d28a;font-size:11px;font-weight:800}

#prompt{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);max-width:94%;padding:8px 12px;
  background:#22363a;color:#fff2cf;border:2px solid #a1b8b0;
  box-shadow:inset 2px 2px 0 #304b4f,inset -2px -2px 0 #15262a,0 4px 0 #0e1b1f;
  font-size:clamp(11px,1.12vw,15px);text-align:center;pointer-events:none;white-space:normal;line-height:1.32;text-transform:uppercase
}
#prompt:empty{display:none}

#dialogue{
  position:absolute;z-index:5;bottom:2%;left:3%;width:94%;padding:14px;
  background:#1d3036;border:3px solid #efd39f;color:#fff8e8;
  box-shadow:inset 0 0 0 3px #314c55,inset 0 0 0 6px #132126,0 6px 0 #101c20;
  max-height:86%;overflow:auto;overscroll-behavior:contain
}
.dialog-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:2px solid #3f5d64}
#portrait{width:52px;height:52px;image-rendering:pixelated;background:#6d8d88;border:2px solid #efd39f;box-shadow:inset -2px -2px 0 #36514f,inset 2px 2px 0 #96b2a7;flex:none}
#speaker{font-weight:900;font-size:clamp(16px,1.8vw,22px);color:#ffd688;text-transform:uppercase;line-height:1.05;text-shadow:2px 2px 0 #5f4724,4px 0 0 #5f472422}
#role{font-size:12px;color:#cfe0d8;text-transform:uppercase;letter-spacing:.04em}
#line{font-size:clamp(13px,1.25vw,17px);line-height:1.7;white-space:pre-line;color:#fff8ea}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.choice{
  min-height:38px;text-align:left;background:#365159;color:#f7edd9;border:2px solid #88a39f;
  box-shadow:inset 2px 2px 0 #45656f,inset -2px -2px 0 #20343a,0 3px 0 #16262b;
  padding:8px 10px;font-size:clamp(11px,1vw,14px);font-weight:700;text-transform:none;line-height:1.45
}
.choice:hover{background:#41616b}
.choice.selected,.choice:focus-visible{background:#e9d5a7;border-color:#fff0c8;color:#1f3136;box-shadow:inset 2px 2px 0 #fff1cb,inset -2px -2px 0 #bf9f61,0 3px 0 #695126;outline:none}
.choice.selected::before{content:'▶ ';font-weight:900}.choice:not(.selected)::before{content:'· ';font-weight:900;color:#d8c79b}
.source-choice{font-size:12px}
#dialogHint{font-size:11px;color:#aec5bc;margin-top:10px;text-transform:uppercase}

#editor{display:grid;gap:8px;margin-top:10px;padding-top:8px;border-top:2px dashed #52707a}
.edit-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.edit-row .choice{min-height:32px}
.edit-row span{font-size:12px;text-transform:uppercase;color:#d3dfd7}
.edit-code{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;text-transform:uppercase}
.edit-code input{padding:7px 8px;background:#13242b;color:white;border:2px solid #819b95;box-shadow:inset 2px 2px 0 #284048;width:150px;min-width:0}
.editor-preview{width:64px;height:64px;image-rendering:pixelated;margin:auto;background:#76968e;border:2px solid #efd39f;box-shadow:inset 2px 2px 0 #9fb7af,inset -2px -2px 0 #3b5754}

#touchControls{display:none}
.touch #world{flex:1;width:100%;height:auto;min-height:0;box-shadow:none}
.touch #touchControls{flex:none;width:100%;display:flex;justify-content:space-between;align-items:end;padding:8px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#17282f;touch-action:none;box-shadow:0 -4px 0 #0d171b,inset 0 2px 0 #2c4952}.touch .desktop{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,46px);gap:5px}
.dpad button,#actionBtn{border:2px solid #d9bf8d;color:#ffefcb;background:#35545c;box-shadow:inset 2px 2px 0 #4b717b,inset -2px -2px 0 #20343a,0 4px 0 #111d21;touch-action:none;user-select:none;font-weight:900;text-transform:uppercase}
.dpad button{font-size:19px}
.dpad button:active,#actionBtn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 #4b717b,inset -2px -2px 0 #20343a,0 2px 0 #111d21;background:#51707a}
.dpad [data-dir=up]{grid-column:2}.dpad [data-dir=left]{grid-column:1;grid-row:2}.dpad [data-dir=down]{grid-column:2;grid-row:2}.dpad [data-dir=right]{grid-column:3;grid-row:2}
#actionBtn{width:74px;height:74px;font-size:24px;background:#6d5a39;display:flex;flex-direction:column;justify-content:center;align-items:center}
#actionBtn span{font-size:10px;letter-spacing:.06em}

/* avatar editor buttons */
.avatar-pick{min-width:34px;min-height:30px;padding:0 8px;background:#355159;color:#f7ecd8;border:2px solid #819b95;box-shadow:inset 2px 2px 0 #47656c,inset -2px -2px 0 #22343a,0 3px 0 #152429;font-size:12px}
.avatar-pick[aria-pressed=true]{background:#e9d5a7;color:#203136;border-color:#fff0c8;box-shadow:inset 2px 2px 0 #fff0cb,inset -2px -2px 0 #c2a262,0 3px 0 #6b562a}
.avatar-pick.color-only{padding:0;width:30px;height:30px}

.touch #dialogue{bottom:2%;left:3%;width:94%;max-height:88%;padding:11px}.touch #choices{grid-template-columns:1fr;gap:6px}.touch .choice{min-height:40px;font-size:14px}.touch #line{font-size:15px}.touch #avatarBtn{top:8px;right:8px}.touch #prompt{bottom:8px;font-size:11px}.touch.dialog-open #touchControls .dpad{opacity:.45}.touch.dialog-open #actionBtn{opacity:.75}
@media(max-height:520px) and (pointer:coarse){.touch #touchControls{position:absolute;bottom:0;z-index:3;background:transparent;pointer-events:none;box-shadow:none}.touch #touchControls button{pointer-events:auto}.touch #world{height:100dvh}.touch #prompt{bottom:92px}.touch #dialogue{bottom:4%;max-height:90%;left:18%;width:64%}.touch #choices{grid-template-columns:repeat(2,minmax(0,1fr))}}

#dialogue:has(#editor:not([hidden])) #portrait{width:76px;height:76px}
#dialogue:has(#editor:not([hidden])) #line:empty{display:none}

#avatarBtn,.choice,#prompt,#dialogue,.dpad button,#actionBtn{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));}

/* Dialogue type: original block glyphs, proportional widths, pixel drop shadow. */
#dialogue{font-family:MissionBlock,MissionPixel,monospace;font-weight:400;letter-spacing:.01em}
#speaker,#role,#line,#dialogHint,#dialogue .choice,#dialogue input{font-weight:400}
#speaker{font-size:clamp(24px,2.6vw,34px);text-shadow:2px 2px #57472c}
#role{font-size:clamp(16px,1.6vw,21px);text-shadow:1px 1px #102025}
#line{font-size:clamp(20px,1.8vw,25px);line-height:1.40;text-shadow:2px 2px #102127}
#dialogue .choice{font-size:clamp(17px,1.5vw,21px);line-height:1.40;overflow-wrap:anywhere}
#dialogHint{font-size:16px}
.touch #line{font-size:20px;line-height:1.38}.touch #dialogue .choice{font-size:18px}.touch #speaker{font-size:26px}.touch #role{font-size:17px}
/* Single opening rules screen, no permanent new UI. */
.rules-open #world::after{content:"";position:absolute;inset:0;background:#101e29a6;z-index:4;pointer-events:none}
.rules-open #avatarBtn,.rules-open #prompt{visibility:hidden}
.rules-open #dialogue{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(84%,780px);max-height:92%;padding:clamp(14px,2vw,26px);border-color:#eed7a7}
.rules-open #speaker{font-size:clamp(26px,3vw,38px)}
.rules-open #line{font-size:clamp(18px,1.75vw,23px);line-height:1.36;white-space:pre-line}
.rules-open #choices{grid-template-columns:1fr}.rules-open #choices .choice{text-align:center;background:#e9d5a7;color:#203136;border-color:#fff0c8}
.rules-open #choices .choice::before{content:"▶ "}
.touch.rules-open #dialogue{left:50%;top:50%;bottom:auto;width:94%;max-height:96%;padding:12px}
.touch.rules-open #line{font-size:17px;line-height:1.32}.touch.rules-open #speaker{font-size:25px}.touch.rules-open #role{font-size:16px}
.rules-open #touchControls{opacity:.35}


/* Adaptive fullscreen world and compact controls */
#game{height:100vh;height:100dvh;justify-content:flex-start;background:#17282f}
#world,.touch #world{flex:1 1 0;width:100%;height:auto;min-height:0;box-shadow:none}
#scene{width:100%;height:100%;object-fit:fill}
#avatarBtn,#soundBtn{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));font-family:MissionBlock,MissionPixel,monospace}
#soundBtn{position:absolute;z-index:4;right:max(74px,calc(env(safe-area-inset-right) + 64px));min-width:43px;height:35px;padding:4px 7px;background:#274149;color:#fff2d0;border:2px solid #ecd2a3;box-shadow:inset -2px -2px #162a31,inset 2px 2px #3f6570,0 3px #112126;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1}
.sound-mark{font-family:monospace;font-size:22px}.sound-key{font-size:13px}
#dialogue{left:50%;transform:translateX(-50%);width:min(94%,900px);bottom:12px;max-height:calc(100% - 24px);scrollbar-color:#a9b9a0 #25383b}
#dialogue #line{font-size:clamp(18px,2.15vw,25px);line-height:1.4}
#dialogue .choice{font-size:clamp(16px,1.75vw,21px);min-height:40px}
#prompt{width:max-content;max-width:calc(100% - 20px);font-size:clamp(14px,1.6vw,19px)}
.rules-open #avatarBtn,.rules-open #soundBtn,.avatar-onboarding #avatarBtn,.avatar-onboarding #soundBtn{visibility:hidden}
.rules-open #dialogue,.avatar-onboarding #dialogue{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(94%,780px);max-height:96%}
.avatar-onboarding #world:after{content:'';position:absolute;inset:0;background:#101e2990;z-index:4;pointer-events:none}
.avatar-onboarding #dialogue #line{font-size:clamp(17px,1.7vw,22px)}
.avatar-onboarding #choices{grid-template-columns:1fr}
.avatar-onboarding #editor{gap:5px}.avatar-onboarding .edit-row{gap:7px}
.avatar-onboarding #portrait{width:82px;height:82px}
.touch #touchControls{position:relative;bottom:auto;z-index:2;pointer-events:auto;background:#17282f;flex:0 0 auto;padding:8px max(15px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left))}
.touch .dpad{grid-template-columns:repeat(3,clamp(43px,13vw,60px));grid-template-rows:repeat(2,46px);gap:5px}
.touch #actionBtn{width:76px;height:76px}.touch #soundBtn{right:max(58px,calc(env(safe-area-inset-right) + 48px));min-width:38px}
.touch #dialogue{width:94%;left:50%;bottom:8px;max-height:calc(100% - 16px)}
.touch #dialogue #line{font-size:clamp(17px,4.6vw,21px);line-height:1.35}.touch #dialogue .choice{font-size:clamp(16px,4.15vw,19px);min-height:42px}
.touch #choices{grid-template-columns:1fr}.touch #prompt{bottom:9px;font-size:14px}
.touch.rules-open #touchControls,.touch.avatar-onboarding #touchControls,.touch.dialog-open #touchControls{display:none}
.touch.rules-open #dialogue,.touch.avatar-onboarding #dialogue{bottom:auto;max-height:96%;width:94%}
.touch.rules-open #dialogue #line{font-size:clamp(16px,4.3vw,20px)}
.touch.avatar-onboarding #dialogue .choice{min-height:37px;padding:5px 7px}
@media (orientation:landscape) and (max-height:560px){.touch #touchControls{position:absolute;inset:auto 0 0;z-index:3;pointer-events:none;background:transparent;box-shadow:none;padding:6px 12px}.touch #touchControls button{pointer-events:auto}.touch .dpad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,40px)}.touch #actionBtn{width:62px;height:62px}.touch #prompt{bottom:8px;max-width:57%;font-size:12px}.touch #dialogue{width:min(92%,760px)}.touch #choices{grid-template-columns:repeat(2,minmax(0,1fr))}.touch.rules-open #choices,.touch.avatar-onboarding #choices{grid-template-columns:1fr}}


.touch #avatarBtn .desktop,.touch #soundBtn .desktop{display:none!important}
@media (orientation:landscape) and (max-height:560px){
 .touch.avatar-onboarding #dialogue{padding:9px 13px}
 .touch.avatar-onboarding .dialog-top{padding-bottom:4px;margin-bottom:4px}
 .touch.avatar-onboarding #portrait{width:50px;height:50px}
 .touch.avatar-onboarding #speaker{font-size:23px}.touch.avatar-onboarding #role{font-size:15px}
 .touch.avatar-onboarding #dialogue #line{font-size:15px;line-height:1.22}
 .touch.avatar-onboarding #editor{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 9px;margin-top:5px;padding-top:5px}
 .touch.avatar-onboarding .edit-row .choice{font-size:14px;min-height:32px;padding:3px 6px}
 .touch.avatar-onboarding .edit-code{font-size:13px;gap:4px}
 .touch.avatar-onboarding #choices{margin-top:7px}.touch.avatar-onboarding #choices .choice{min-height:35px}
}

/* Stable dialogue size while letters appear. */
#dialogue.typing #line{display:grid;grid-template-columns:minmax(0,1fr)}
.line-ghost,.line-ink{grid-area:1/1;white-space:pre-line;overflow-wrap:break-word}
.line-ghost{visibility:hidden;pointer-events:none}
#skipTyping{width:100%;margin-top:12px;text-align:center;color:#f8e9c4}
#skipTyping:before{content:none}
@media (pointer:fine){#skipTyping{display:none}}
.touch #skipTyping:not([hidden]){display:block;min-height:44px}

/* Touch-first interaction: no text selection or browser search popup. */
html,body,#game,canvas,button,#prompt,#tapHelp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#scene{touch-action:none}#dialogue{touch-action:pan-y}#prompt{pointer-events:none}
.touch #touchControls{position:relative;inset:auto;display:flex;align-items:center;gap:8px;min-height:54px;padding:5px 10px max(7px,env(safe-area-inset-bottom));background:#17282f;pointer-events:auto;box-shadow:0 -2px #102127}
.touch #tapHelp{font-family:MissionBlock,monospace;font-size:clamp(12px,3.4vw,16px);line-height:1.2;max-width:55%;color:#e9d8ae}
.touch #actionBtn{width:auto;height:auto;min-width:108px;min-height:42px;font:16px MissionBlock,monospace;line-height:1.15;padding:7px 9px;text-transform:none;flex:none}
.touch #prompt{max-width:calc(100% - 18px);font-size:13px;line-height:1.25;bottom:7px;padding:6px 8px;overflow-wrap:anywhere}
.touch #soundBtn,.touch #avatarBtn{min-height:42px;min-width:42px}
.touch #soundBtn{right:62px}
.touch.rules-open #touchControls,.touch.avatar-onboarding #touchControls,.touch.dialog-open #touchControls{display:none}
@media(orientation:landscape) and (max-height:560px){.touch #touchControls{position:relative;inset:auto;min-height:44px;padding:3px 12px 4px}.touch #actionBtn{min-height:36px;font-size:14px}.touch #tapHelp{font-size:14px}.touch #prompt{font-size:12px}}

function interact(){if(state.active){if(!state.draft)choose();return}const n=nearest();if(n)talkTo(n)}
let footDistance=0;
function move(dt){if(state.active||onboarding)return;const p=state.p;let x=0,y=0;
 const ox=p.x,oy=p.y;
 if(autoWalk){let budget=dt*90;while(autoWalk&&budget>0){const next=autoWalk.path[0];if(!next){const n=autoWalk.target;autoWalk=null;if(n)talkTo(n);break;}const dx=next.x-p.x,dy=next.y-p.y,d=Math.hypot(dx,dy);if(d<.05){p.x=next.x;p.y=next.y;autoWalk.path.shift();continue;}const step=Math.min(budget,d),nx=p.x+dx/d*step,ny=p.y+dy/d*step;if(blocked(nx,ny)){autoWalk=null;break;}p.x=nx;p.y=ny;x=dx;y=dy;budget-=step;if(step>=d-.001){p.x=next.x;p.y=next.y;autoWalk.path.shift();}}}
 else {if(state.keys.has('left'))x--;if(state.keys.has('right'))x++;if(state.keys.has('up'))y--;if(state.keys.has('down'))y++;const mag=Math.hypot(x,y);if(mag){const dx=x/mag*dt*90,dy=y/mag*dt*90;if(dx&&!blocked(p.x+dx,p.y))p.x+=dx;if(dy&&!blocked(p.x,p.y+dy))p.y+=dy;}}
 if(x||y)p.dir=Math.abs(y)>=Math.abs(x)&&y?(y<0?'up':'down'):(x<0?'left':'right');const distance=Math.hypot(p.x-ox,p.y-oy);if(distance>.001){if(!p.walk){sound.play('step');footDistance=0;}p.walk+=dt*13;footDistance+=distance;if(footDistance>=22){sound.play('step');footDistance%=22}}else{p.walk=0;footDistance=0}}
// Character-centred camera: the world scrolls even near the map boundary.
function camera(){
 const rect=world.getBoundingClientRect(),cw=Math.max(1,rect.width),ch=Math.max(1,rect.height),aspect=cw/ch;
 const maxW=touch?(aspect<1?184:260):260;
 const maxH=touch?(aspect<1?308:156):166;
 const scale=Math.max(cw/maxW,ch/maxH);
 const ww=Math.max(1,Math.round(cw/scale)),hh=Math.max(1,Math.round(ch/scale));
 if(scene.width!==ww*2||scene.height!==hh*2){scene.width=ww*2;scene.height=hh*2;}
 // Align the camera with the player's body rather than their feet.
 const px=state.p.x-ww/2,py=state.p.y-13-hh/2;const x=touch?Math.max(-14,Math.min(WORLD_W+14-ww,px)):px,y=touch?Math.max(-14,Math.min(WORLD_H+14-hh,py)):py;return {x:Math.round(x*2)/2,y:Math.round(y*2)/2,w:ww,h:hh};
}
const off=document.createElement('canvas');off.width=WORLD_W*2;off.height=WORLD_H*2;const wctx=off.getContext('2d');
function render(t){const c=wctx;c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;c.clearRect(0,0,600,400);c.drawImage(mapCanvas,0,0);drawRoomSigns(c,touch);refreshGuide(t);drawGuide(c,t);const actors=[...npcs.map(n=>({...n,type:'npc'})),{...state.p,look:avatar,type:'player'}].sort((a,b)=>a.y-b.y);for(const a of actors)sprite(c,a.x,a.y,a.look,1,a.type==='player'?a.dir:'down',a.type==='player'?a.walk:0,a.uniform);for(const n of npcs){const m=myths.find(m=>m.room===n.id);const complete=state.learned.has(n.id)&&(!m||state.myths.has(m.id));const y=n.y-(touch?44:51);pixelSign(c,(complete?'✓ ':'! ')+n.name,n.x,y,touch?1:1.5,'npc');}for(const term of terminals){const ready=term.id==='board'?state.stage===2:state.stage>=3;if(ready){q(c,term.x-4,term.y-32,8,8,'#e8c16e');text(c,'!',term.x,term.y-32,7,'#304b4b','center')}}
 const near=nearest();if(near&&!state.active&&!near.info){pixelSign(c,near.id==='board'?'МІСІЇ':'ОСВІТА',near.x,near.y-43,1.5,'npc')}
 const v=camera();lastCamera=v;ctx.imageSmoothingEnabled=false;
 // A dark exterior surrounds the playable map instead of stopping the camera.
 ctx.fillStyle='#17282f';ctx.fillRect(0,0,scene.width,scene.height);
 ctx.drawImage(off,-v.x*2,-v.y*2);
 if(!state.active){const target=guide?.target;const next=target?(target.info?target.name+' · '+target.role:target.name):'';const action=touch?'Торкнись персонажа':'E — розмовляти';const p=state.stage===4?'Місію завершено':near&&target?.id===near.id?`${near.name} · ${touch?'Торкнись або натисни «Дія»':'E — взаємодія'}`:next?`Далі: ${next} · ${state.stage===1?state.learned.size+'/6':''}`:labels[state.stage-1];if(prompt.textContent!==p)prompt.textContent=p;if(touch){const a=$('actionBtn'),label=autoWalk?'Зупинити':near&&guide?.target?.id===near.id?'Дія':'За стрілками';if(a.textContent!==label)a.textContent=label;}}
}
let last=performance.now();function frame(t){move(Math.min(.034,(t-last)/1000));last=t;render(t);requestAnimationFrame(frame)}
const dirMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{if(document.body.classList.contains('rules-open')){if(e.code==='Enter'&&!e.repeat){e.preventDefault();startAvatarOnboarding();}return}if(touch)return;if(e.code==='KeyM'&&e.target.tagName!=='INPUT'&&!e.repeat){e.preventDefault();sound.toggle();return}if(e.target.tagName==='INPUT'){if(e.code==='Escape'||e.code==='Enter'){e.preventDefault();scene.focus()}return}const d=dirMap[e.code];if(d||['Enter','Space','KeyE','KeyC','Tab','Escape'].includes(e.code))e.preventDefault();if(state.active){if(typing){if(!e.repeat&&['Enter','Space','KeyE'].includes(e.code))fullLine();return}if(state.draft){if(e.repeat)return;if(d==='up'||e.code==='Tab'&&e.shiftKey)editSelect(-1);else if(d==='down'||e.code==='Tab')editSelect(1);else if(d==='left')editAction(-1);else if(d==='right'||e.code==='Enter'||e.code==='Space')editAction();else if(e.code==='KeyC')editor.querySelector('input')?.focus();else if(e.code==='Escape'&&!onboarding)closeDialog();return}if(d==='up'||d==='left'||e.code==='Tab'&&e.shiftKey)select(state.sel-1);else if(d==='down'||d==='right'||e.code==='Tab')select(state.sel+1);else if(!e.repeat&&['Enter','Space','KeyE'].includes(e.code))choose();else if(e.code==='Escape'){/* keep learning steps intact; explicit exits */}return}if(d)state.keys.add(d);else if(!e.repeat&&['KeyE','Enter','Space'].includes(e.code))interact();else if(!e.repeat&&e.code==='KeyC')editAvatar()});window.addEventListener('keyup',e=>{const d=dirMap[e.code];if(d)state.keys.delete(d)});window.addEventListener('blur',stopWalking);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopWalking()});
if(touch){
 scene.addEventListener('pointerdown',e=>{if(state.active||onboarding||!lastCamera)return;e.preventDefault();sound.start();const r=scene.getBoundingClientRect(),v=lastCamera;tapAt(v.x+(e.clientX-r.left)*v.w/r.width,v.y+(e.clientY-r.top)*v.h/r.height);});
 $('actionBtn').addEventListener('click',()=>{if(state.active)return;sound.start();if(autoWalk){stopWalking();return;}const n=guide?.target;if(n){if(canTalk(n))talkTo(n);else startWalk(routeTo([n]));}else if(nearest())interact();});
 document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault();});
 document.addEventListener('selectstart',e=>{if(!e.target.closest('input'))e.preventDefault();});
}
$('avatarBtn').addEventListener('click',()=>{if(touch)editAvatar()});$('soundBtn').addEventListener('click',()=>{if(touch)sound.toggle()});scene.focus({preventScroll:true});showRules();requestAnimationFrame(frame);
function startAvatarOnboarding(){
 if(!document.body.classList.contains('rules-open'))return;
 sound.start();document.body.classList.remove('rules-open');closeDialog();editAvatar(true);
}
function showRules(){
 document.body.classList.add('rules-open');
 const instructions=touch?'Торкнись підлоги — герой піде туди. Торкнись фахівця — герой підійде до нього й почне розмову. Золоті стрілки показують шлях до наступної цілі. Кнопка внизу допоможе пройти за ними або зупинитися.':'WASD або стрілки — ходити. E — говорити з фахівцем. ↑ ↓ — вибрати відповідь. Enter — показати репліку повністю або підтвердити. C — змінити аватар. M — звук. Золоті стрілки ведуть до наступної цілі.';
 const line='Твоя місія — дослідити центр і познайомитися з професіями реабілітації.\n\n1. Поговори із 6 фахівцями й перевір 6 тверджень.\n2. Виконай три мініігри у залі руху, кімнаті побутових навичок та майстерні протезування.\n3. Знайди кіоск «ОСВІТА», обери напрям і склади освітній маршрут.\n\n'+instructions+'\n\nНе поспішай: помилки — можливість навчитися.\n\nГотовий або готова до пригоди? Спочатку створи свого героя: обери зачіску, одяг та інші деталі. Далі на тебе чекає центр відновлення!';
 setDialog('МІСІЯ: ВІДНОВЛЕННЯ','Правила гри',line,[{label:touch?'Створити аватар →':'Enter — створити аватар',action:startAvatarOnboarding}]);
 $('dialogHint').textContent='Enter · перейти до створення персонажа';
